name: Release Packaging

# v0.9.0 Phase 3 — Enterprise Distribution pipeline.
#
# On every published tag (v*) and on manual dispatch, this workflow:
#   1. runs the full CI gates (build + test) on the pinned toolchain,
#   2. builds the static musl binaries (bare-metal / ISO appliance),
#   3. packages the .deb (cargo-deb) and .rpm (cargo-generate-rpm),
#   4. builds & pushes the OCI image to ghcr.io,
#   5. attaches every artifact (with a SHA-256 manifest) to the GitHub
#      Release, so enterprise storage teams can vendor the exact bits.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify (tests must be green before anything ships)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Kernel loop module for hardware suites
        run: sudo modprobe loop || true
      - name: Format + lint gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace test suite (as root)
        run: sudo -E env "PATH=$PATH" cargo test --workspace --quiet

  musl-static:
    name: Static musl binaries
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static release binaries
        run: |
          cargo build --release -p dc-cli --target ${{ matrix.target }}
          cd target/${{ matrix.target }}/release
          tar -czf ../../../dc-${{ matrix.target }}.tar.gz dc diskcleaner
          sha256sum ../../../dc-${{ matrix.target }}.tar.gz > ../../../dc-${{ matrix.target }}.tar.gz.sha256
      - name: Upload musl artifact
        uses: actions/upload-artifact@v4
        with:
          name: dc-${{ matrix.target }}
          path: |
            target/dc-${{ matrix.target }}.tar.gz
            target/dc-${{ matrix.target }}.tar.gz.sha256

  deb-package:
    name: Debian package (.deb)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release binaries then package
        run: |
          cargo build --release -p dc-cli
          cargo deb -p dc-cli --output target/diskcleaner_amd64.deb
          sha256sum target/diskcleaner_amd64.deb > target/diskcleaner_amd64.deb.sha256
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: |
            target/diskcleaner_amd64.deb
            target/diskcleaner_amd64.deb.sha256

  rpm-package:
    name: RPM package (.rpm)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binaries then package
        run: |
          cargo build --release -p dc-cli
          cargo generate-rpm -p dc-cli -o target/diskcleaner.x86_64.rpm
          sha256sum target/diskcleaner.x86_64.rpm > target/diskcleaner.x86_64.rpm.sha256
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: |
            target/diskcleaner.x86_64.rpm
            target/diskcleaner.x86_64.rpm.sha256

  oci-image:
    name: OCI image (ghcr.io)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Attach artifacts to the release
    runs-on: ubuntu-latest
    needs: [musl-static, deb-package, rpm-package, oci-image]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release with checksums
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.deb
            artifacts/*.deb.sha256
            artifacts/*.rpm
            artifacts/*.rpm.sha256
