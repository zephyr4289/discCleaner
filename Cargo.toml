[workspace]
resolver = "2"
members = [
    "crates/dc-core",
    "crates/dc-probe",
    "crates/dc-io",
    "crates/dc-verify",
    "crates/dc-cert",
    "crates/dc-cli",
    "crates/dc-testkit",
    "crates/dc-hw",
    "crates/dc-nvme",
    "crates/dc-ata",
    "crates/dc-scsi",
    "crates/dc-mmc",
    "crates/dc-opal",
    "crates/dc-tui",
    "crates/dc-report",
    "crates/dc-tpm",
    "crates/dc-vault",
    "crates/dc-photon",
    "crates/dc-iscsi",
    "crates/dc-pq",
    "crates/dc-web",
    "crates/dc-cloud",
    "crates/dc-zk",
    "crates/dc-cxl",
    "crates/dc-verify-formal",
    "crates/dc-vdf",
    "crates/dc-sonar",
    "crates/dc-baremetal",
    "crates/dc-mesh",
    "crates/dc-wear",
    "crates/dc-fpga",
    "crates/dc-remanence",
    "crates/dc-fhe",
    "crates/dc-optix",
    "crates/dc-resurrect",
]

[workspace.dependencies]
dc-core = { path = "crates/dc-core" }
dc-probe = { path = "crates/dc-probe" }
dc-io = { path = "crates/dc-io" }
dc-verify = { path = "crates/dc-verify" }
dc-cert = { path = "crates/dc-cert" }
dc-hw = { path = "crates/dc-hw" }
dc-nvme = { path = "crates/dc-nvme" }
dc-ata = { path = "crates/dc-ata" }
dc-scsi = { path = "crates/dc-scsi" }
dc-mmc = { path = "crates/dc-mmc" }
dc-opal = { path = "crates/dc-opal" }
dc-tui = { path = "crates/dc-tui" }
dc-report = { path = "crates/dc-report" }
dc-tpm = { path = "crates/dc-tpm" }
dc-vault = { path = "crates/dc-vault" }
dc-photon = { path = "crates/dc-photon" }
dc-iscsi = { path = "crates/dc-iscsi" }
dc-pq = { path = "crates/dc-pq" }
dc-web = { path = "crates/dc-web" }
dc-cloud = { path = "crates/dc-cloud" }
dc-zk = { path = "crates/dc-zk" }
dc-cxl = { path = "crates/dc-cxl" }
dc-verify-formal = { path = "crates/dc-verify-formal" }
dc-vdf = { path = "crates/dc-vdf" }
dc-sonar = { path = "crates/dc-sonar" }
dc-baremetal = { path = "crates/dc-baremetal" }
dc-mesh = { path = "crates/dc-mesh" }
dc-wear = { path = "crates/dc-wear" }
dc-fpga = { path = "crates/dc-fpga" }
dc-remanence = { path = "crates/dc-remanence" }
dc-fhe = { path = "crates/dc-fhe" }
dc-optix = { path = "crates/dc-optix" }
dc-resurrect = { path = "crates/dc-resurrect" }
dc-testkit = { path = "crates/dc-testkit" }

# System & I/O
rustix = { version = "0.38", features = ["fs", "param", "process", "thread", "system"] }
libc = "0.2"

# CLI & UX
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization & Canonicalization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"

# Cryptography & Hashing
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8"] }
# FROST2 threshold-Schnorr arithmetic (already in the lockfile transitively
# via ed25519-dalek — explicit declaration is supply-chain neutral).
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "rand_core"] }
chacha20 = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
# Secret hygiene: volatile zeroization (+ on-drop derive). Applied to every
# key holder, PIN buffer and TPM-sealed secret across the workspace.
zeroize = "1.8"
hex = "0.4"
base64 = "0.22"

# Error Handling
thiserror = "2.0"

# Testing
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
proptest = "1.5"

# ---------------------------------------------------------------------------
# Size-optimized profile for the bare-metal payload family: dc-baremetal
# Ghost Boot (UEFI) and dc-fpga Ghost Silicon (RISC-V softcore).
#
# Cargo ignores [profile] tables in member manifests, so the size budget
# lives here and is selected explicitly:
#   cargo build -p dc-baremetal --target x86_64-unknown-uefi --profile ghost --features efi
#   cargo build -p dc-fpga --target riscv32imc-unknown-none-elf --profile ghost --features silicon
[profile.ghost]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

# ---------------------------------------------------------------------------
# Workspace lints
# ---------------------------------------------------------------------------
# Centralized, documented lint policy. Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
# NOTE: no blanket `unsafe_code = "deny"` — this is an ioctl/signal/flock FFI
# tool by nature (see docs/SECURITY.md "unsafe policy"). Every unsafe block
# in the tree is a bounded libc call with its invariants documented inline.

[workspace.lints.clippy]
# DcError is the forensic error type: every variant carries auditable context
# (guardian codes, LBA locations, chain indices). Boxing it into an indirection
# would trade forensic clarity for stack bytes; 45 call sites are fine as-is.
result_large_err = "allow"
# DcError's Guardian variant is intentionally large for the same reason.
large_enum_variant = "allow"
# Purge ladders, engine constructors and projector functions take explicit
# parameters instead of option structs: at this safety level, every argument
# should be visible at the call site.
too_many_arguments = "allow"
# High-value lints kept ON (fail CI):
#   - clippy::unwrap_used stays allowed only inside dc-testkit (see below)
