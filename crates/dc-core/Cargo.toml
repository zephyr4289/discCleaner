[package]
name = "dc-core"
version = "0.4.0"
edition = "2024"

[features]
default = []
# Opt-in fault-injection hooks (DC_CRASH_AT / DC_SIGNAL_AT) for release-profile
# test rigs. Debug builds enable these hooks automatically via `debug_assertions`.
fault-injection = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
chacha20 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3.14"

[lints]
workspace = true
