[package]
name = "dc-vdf"
version = "0.12.0"
edition = "2024"
description = "Cryptographic Proof-of-Erasure via Verifiable Delay Functions (v0.12.0, Miracle 1): Wesolowski proofs over an RSA unknown-order group, pure-Rust Montgomery arithmetic, and time-lock weave binding of overwrite passes — certificates that prove WHEN a wipe ran, independent of system clocks"

[dependencies]
