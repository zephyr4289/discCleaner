name: Forensic Engine CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Unit & Forensic Invariants Test Matrix (including T1 Zero-Trust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Kernel Loop Module
        run: sudo modprobe loop

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests as Root (T1 Zero-Trust Suite)
        run: sudo -E env "PATH=$PATH" cargo test --workspace --verbose

      - name: Build Release Binaries
        run: cargo build --release --workspace
