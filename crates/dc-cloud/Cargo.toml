[package]
name = "dc-cloud"
version = "0.10.0"
edition = "2024"
description = "Cloud block-storage lifecycle orchestration: attach -> sanitize -> verify -> detach with signed audit receipts binding the cloud context (v0.10.0)"

[features]
default = []
# Production TLS transport for AWS API calls (EC2 endpoints are HTTPS-only).
# Off by default to keep the musl appliance build dependency-free; enable in
# packaged builds that run `dc cloud` against real accounts.
cloud-tls = ["ureq"]

[dependencies]
dc-core = { workspace = true }
dc-cert = { workspace = true }
# SigV4 canonicalization + receipt hashing (workspace-pinned).
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
# Optional HTTPS transport (see [features] above).
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
