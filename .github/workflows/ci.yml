name: Forensic Engine CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: Format, Lint, Unit + Integration Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Kernel Loop Module (hardware suites run as root)
        run: sudo modprobe loop

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy Lint (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile Check with Lockfile Committed
        run: cargo check --workspace --locked

      - name: Run Workspace Tests as Root (T1 Zero-Trust Suite)
        run: sudo -E env "PATH=$PATH" cargo test --workspace --verbose

  regression-guards:
    name: REG-* Defect Pinning Suite
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run r900 regression guards by name
        run: cargo test -p dc-cli --test r900_regression_guards -- --nocapture

  lit-runner:
    name: lit-style suite driver
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Discover and run all suites
        run: python3 tests/run_tests.py

  release-audit:
    name: Release Binary Fault-Injection Audit
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Release binaries must reject fault-injection environment
        run: |
          # The fault-injection hooks compile ONLY into debug builds.
          # A release binary given DC_CRASH_AT must run to completion
          # (exit 0/2), never honor the kill hook (exit -9 / 137).
          set -e
          OUT=$(mktemp -d)
          set +e
          timeout 30 ./target/release/diskcleaner check --target /nonexistent >/dev/null 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 2 ]; then
            echo "FAIL: expected exit 2 for missing target, got $CODE"; exit 1
          fi
          DC_CRASH_AT=header-write timeout 30 ./target/release/diskcleaner check --target /nonexistent >/dev/null 2>&1
          CODE=$?
          if [ "$CODE" -eq 137 ] || [ "$CODE" -eq -9 ]; then
            echo "FAIL: release binary honored DC_CRASH_AT (SIGKILL)"; exit 1
          fi
          echo "PASS: release surface is free of fault-injection behavior"
      - name: Dependency audit
        run: cargo audit || echo "cargo-audit not installed; skipping (install with: cargo install cargo-audit)"

  zk-expensive-suite:
    name: ZK Full-Circuit Suite (release)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
      - name: Groth16 full-circuit tests (release mode)
        run: cargo test -p dc-zk -p dc-cli --release -- --ignored

  byzantine-swarm-suite:
    name: Byzantine Swarm Drills (v0.13.0, Frontier 1)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full dc-mesh BFT suite (liar, silent, equivocator, replay)
        run: cargo test -p dc-mesh -- --nocapture
      - name: CLI drill — liar is caught, isolated and named
        run: |
          cargo build -p dc-cli
          ./target/debug/dc mesh simulate --nodes 7 --byzantine 3=liar --out /tmp/liar-cert.json
          grep -q '"failed_spot_proof"' /tmp/liar-cert.json || { echo "FAIL: liar not in the rogue ledger"; exit 1; }
      - name: CLI drill — equivocator is exposed in the decided block
        run: |
          ./target/debug/dc mesh simulate --nodes 7 --byzantine 5=equivocator --out /tmp/eq-cert.json
          grep -q '"equivocation"' /tmp/eq-cert.json || { echo "FAIL: equivocator not named"; exit 1; }
      - name: CLI drill — silent node is timed out; certificate verifies offline
        run: |
          ./target/debug/dc mesh simulate --nodes 7 --byzantine 1=silent --out /tmp/silent-cert.json
          grep -q '"timeout"' /tmp/silent-cert.json || { echo "FAIL: silent node not timed out"; exit 1; }
          ./target/debug/dc mesh verify --cert /tmp/silent-cert.json

  silicon-wear-suite:
    name: Silicon Wear Physics Suite (v0.13.0, Frontier 2)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full dc-wear statistics suite (F-N ledger, Vth, RBER, coverage)
        run: cargo test -p dc-wear -- --nocapture
      - name: CLI campaign — 100% channel coverage certifies
        run: |
          cargo build -p dc-cli
          ./target/debug/dc wear simulate --device-id CI-WEAR-1 --cycles 3000 --out /tmp/wear-cert.json
          grep -q '"verified": true' /tmp/wear-cert.json || { echo "FAIL: honest campaign must certify"; exit 1; }
          ./target/debug/dc wear verify --cert /tmp/wear-cert.json
      - name: Tamper detection — flipped field breaks the digest
        run: |
          python3 - <<'EOF'
          import json
          c = json.load(open('/tmp/wear-cert.json'))
          c['device_id'] = 'COUNTERFEIT'
          json.dump(c, open('/tmp/wear-tampered.json', 'w'))
          EOF
          if ./target/debug/dc wear verify --cert /tmp/wear-tampered.json >/dev/null 2>&1; then
            echo "FAIL: tampered certificate must not verify"; exit 1
          fi
          echo "PASS: tamper detection holds"

  ghost-silicon-suite:
    name: Ghost Silicon Interceptor Suite (v0.13.0, Frontier 3)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full dc-fpga state machine suite (gate, eFuse, latch, faults)
        run: cargo test -p dc-fpga -- --nocapture
      - name: CLI drill — completion burns exactly the documented fuses
        run: |
          cargo build -p dc-cli
          ./target/debug/dc fpga simulate --lanes 2 | tee /tmp/fpga-drill.log
          grep -q 'ROOT OF DESTRUCTION COMPLETE' /tmp/fpga-drill.log
          grep -q '0x60000003' /tmp/fpga-drill.log || { echo "FAIL: fuse word mismatch (want 0x60000003 for 2 lanes)"; exit 1; }

  ghost-silicon-build:
    name: Ghost Silicon RISC-V payload (v0.13.0, Frontier 3)
    runs-on: ubuntu-latest
    needs: ghost-silicon-suite
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the RISC-V bare-metal target
        run: rustup target add riscv32imc-unknown-none-elf
      - name: Build the open-silicon payload (ghost profile)
        run: |
          cargo build -p dc-fpga --target riscv32imc-unknown-none-elf \
                      --profile ghost --features silicon
          SIZE=$(stat -c%s target/riscv32imc-unknown-none-elf/ghost/dc-ghost-silicon)
          echo "Ghost Silicon payload size: ${SIZE} bytes"
          if [ "${SIZE}" -gt 65536 ]; then
            echo "FAIL: payload exceeds the 64 KB softcore budget"; exit 1
          fi
          echo "PASS: within the 64 KB budget"

  remanence-annihilation-suite:
    name: Remanence Annihilation Suite (v0.14.0, Breakthrough 1)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full dc-remanence physics suite (ladder, dither, PRML, omnibus)
        run: cargo test -p dc-remanence -- --nocapture
      - name: CLI drill — every track certifies below the -20 dB floor
        run: |
          cargo build -p dc-cli
          ./target/debug/dc remanence simulate --device-id CI-REM-1 --tracks 3 --cells 8192 --out /tmp/rem-cert.json | tee /tmp/rem-drill.log
          grep -q '"verified": true' /tmp/rem-cert.json || { echo "FAIL: honest campaign must certify"; exit 1; }
          grep -q 'falls to the adversary in' /tmp/rem-drill.log
          ./target/debug/dc remanence verify --cert /tmp/rem-cert.json
      - name: Tamper detection — flipped field breaks the digest
        run: |
          python3 - <<'EOF'
          import json
          c = json.load(open('/tmp/rem-cert.json'))
          c['device_id'] = 'COUNTERFEIT'
          json.dump(c, open('/tmp/rem-tampered.json', 'w'))
          EOF
          if ./target/debug/dc remanence verify --cert /tmp/rem-tampered.json >/dev/null 2>&1; then
            echo "FAIL: tampered certificate must not verify"; exit 1
          fi
          echo "PASS: tamper detection holds"

  fhe-erasure-suite:
    name: FHE Erasure Suite (v0.14.0, Breakthrough 2)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full dc-fhe crypto suite (ring, ZK, protocol, certificate)
        run: cargo test -p dc-fhe -- --nocapture
      - name: CLI drill — blind zeroize + ZK proof + spot decryption
        run: |
          cargo build -p dc-cli
          ./target/debug/dc fhe simulate --volume-id CI-FHE-1 --sectors 8 --out /tmp/fhe-cert.json | tee /tmp/fhe-drill.log
          grep -q '"verified": true' /tmp/fhe-cert.json || { echo "FAIL: honest protocol must certify"; exit 1; }
          grep -q 'FHE ERASURE CERTIFICATE: VERIFIED' /tmp/fhe-drill.log
          ./target/debug/dc fhe verify --cert /tmp/fhe-cert.json
      - name: Tamper detection — perturbed statement breaks the digest
        run: |
          python3 - <<'EOF'
          import json
          c = json.load(open('/tmp/fhe-cert.json'))
          # Perturb one stored ciphertext (a lazy provider swapping a
          # sector back): the digest no longer covers the body. (The
          # re-digested case — where the ZK replay itself must reject
          # the forged statement — is covered by the dc-fhe unit
          # suite: tampering_with_a_ciphertext_breaks_the_root_or_zk.)
          c['zeroized'][3]['u']['coeffs'][100] += 7
          json.dump(c, open('/tmp/fhe-forged.json', 'w'))
          EOF
          if ./target/debug/dc fhe verify --cert /tmp/fhe-forged.json >/dev/null 2>&1; then
            echo "FAIL: forged statement must not verify"; exit 1
          fi
          echo "PASS: ZK replay catches the forged sector"

  optical-incinerator-suite:
    name: Optical Incinerator Suite (v0.14.0, Breakthrough 3)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full dc-optix media physics suite (MMC, OPU, layers, eyes)
        run: cargo test -p dc-optix -- --nocapture
      - name: CLI drill — M-DISC glassy carbon annihilates and certifies
        run: |
          cargo build -p dc-cli
          ./target/debug/dc optix simulate --disc-id CI-MDISC-1 --media glassy-carbon --out /tmp/optix-cert.json | tee /tmp/optix-drill.log
          grep -q '"verified": true' /tmp/optix-cert.json || { echo "FAIL: honest campaign must certify"; exit 1; }
          grep -q 'PHOTOBLEACH DESTRUCTION CERTIFICATE: VERIFIED' /tmp/optix-drill.log
          ./target/debug/dc optix verify --cert /tmp/optix-cert.json
      - name: Weak beam refusal — an undercooked run must not certify
        run: |
          python3 - <<'EOF'
          import json
          c = json.load(open('/tmp/optix-cert.json'))
          # Beautify one zone's recorded dose without re-digesting: the
          # digest no longer covers the body. (The re-digested case —
          # caught by verdict recomputation — is covered by the dc-optix
          # unit suite: tampering_with_the_body_breaks_the_digest.)
          c['zones'][0]['min_dose'] = 99.0
          json.dump(c, open('/tmp/optix-forged.json', 'w'))
          EOF
          if ./target/debug/dc optix verify --cert /tmp/optix-forged.json >/dev/null 2>&1; then
            echo "FAIL: tampered certificate must not verify"; exit 1
          fi
          echo "PASS: digest tamper detection holds"

  resurrection-suite:
    name: Dead-Drive Resurrection Suite (v0.15.0)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Full dc-resurrect mission suite (transports, assembler, kernel, proofs)
        run: cargo test -p dc-resurrect -- --nocapture
      - name: CLI drill — a bricked drive resurrects and proves every block
        run: |
          cargo build -p dc-resurrect
          ./target/debug/dc-resurrect demo --scenario firmware --out /tmp/res-proof.drz | tee /tmp/res-drill.log
          grep -q '1020 erased / 4 skipped-bad / 0 failed' /tmp/res-drill.log || { echo "FAIL: full-scale mission must erase"; exit 1; }
          grep -q 'complete block coverage' /tmp/res-drill.log
          ./target/debug/dc-resurrect verify /tmp/res-proof.drz
      - name: CLI drill — vendor lockdown falls back to boundary-scan pin takeover
        run: |
          ./target/debug/dc-resurrect demo --scenario lockdown --out /tmp/res-lockdown.drz | tee /tmp/res-lockdown.log
          grep -q 'boundary-scan pin takeover required' /tmp/res-lockdown.log || { echo "FAIL: Class D must route to EXTEST"; exit 1; }
          ./target/debug/dc-resurrect verify /tmp/res-lockdown.drz
      - name: Tamper detection — a forged leaf breaks the Merkle root
        run: |
          python3 - <<'EOF'
          # Flip one status field in the first block record without
          # re-hashing: the leaf preimage no longer matches the recorded
          # leaf hash. (The re-hashed case — caught by root recomputation —
          # is covered by the dc-resurrect unit suite:
          # tampered_proof_is_rejected.)
          lines = open('/tmp/res-proof.drz').read().splitlines()
          out = []
          for ln in lines:
              # records look like: "00 00000101 0 00000000 <crc> <leaf-hex>"
              parts = ln.split()
              if len(parts) == 6 and parts[0] == '00' and len(parts[1]) == 8:
                  parts[2] = '1'  # forge skipped-bad
                  ln = ' '.join(parts)
              out.append(ln)
          open('/tmp/res-forged.drz', 'w').write('\n'.join(out) + '\n')
          EOF
          if ./target/debug/dc-resurrect verify /tmp/res-forged.drz >/dev/null 2>&1; then
            echo "FAIL: forged proof must not verify"; exit 1
          fi
          echo "PASS: Merkle tamper detection holds"

  ghost-boot-build:
    name: Ghost Boot EFI payload (v0.12.0, Miracle 3)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Add the UEFI target
        run: rustup target add x86_64-unknown-uefi
      - name: Build the pure-Rust bare-metal payload (ghost profile)
        run: |
          cargo build -p dc-baremetal --target x86_64-unknown-uefi --profile ghost --features efi
          SIZE=$(stat -c%s target/x86_64-unknown-uefi/ghost/dc-ghost-efi.efi)
          echo "Ghost Boot payload size: ${SIZE} bytes"
          if [ "${SIZE}" -gt 307200 ]; then
            echo "FAIL: payload exceeds the 300 KB budget"; exit 1
          fi
